name: official-e2e

# 锚定官方提交（zai-org/ZCode merge-base）→ 三平台构建官方@锚点 + 本 fork 产物
# → 以官方机制挂载插件 → E2E（本地同款 scripts/e2e/run.mjs）。
# 官方升级后：merge-base 不变 → 锚点稳定；合并官方 → 锚点自动前移。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "packages/desktop/src/**"
      - "packages/desktop/scripts/**"
      - "packages/services/src/zcode-agent/**"
      - "packages/services/test/**"
      - "packages/ui/src/**"
      - "packages/ui/test/**"
      - "mobile-bridge/**"
      - "scripts/**"
      - ".github/workflows/official-e2e.yml"
  schedule:
    - cron: "0 19 * * *" # 每日 UTC 19 点（官方升级回归）

concurrency:
  group: official-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── fork 侧单测（无需官方锚点，并行快跑）────────────────────────────────
  # 覆盖 fork 功能变更的纯逻辑契约：wire 帧提取/分片重组、goal 看门狗权威状态、
  # standalone 硬隔离开关、移动端行为纯函数（viewport 分层/composer 自动聚焦/
  # /side 门控）、桌面产品身份（standalone/preview/production 风味解析）。
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: services 单测（node:test + tsx）
        run: |
          npx tsx --test \
            packages/services/test/zcodeGoStandaloneGate.test.ts \
            packages/services/test/zcodeGoWireFrame.test.ts \
            packages/services/test/zcodeGoGoalKeepAlive.test.ts \
            packages/services/test/zcodeGoSessionRedirect.test.ts \
            packages/services/test/zcodeGoSilentForkTrigger.test.ts \
            packages/services/test/zcodeGoGoalVerify.test.ts \
            packages/services/test/sessionHistoryLazyReader.test.ts \
            packages/services/test/zcodeGoSyntheticHistory.test.ts
      - name: desktop 静默 fork 归并单测（node:test + tsx）
        run: |
          npx tsx --test \
            packages/desktop/test/zcodeGoSilentForkMerge.test.ts
      - name: ui 单测（tsx + ui tsconfig 路径别名）
        run: |
          npx tsx --tsconfig packages/ui/tsconfig.json --test \
            packages/ui/test/zcodeGoMobileBehavior.test.ts
      - name: desktop 身份模块单测（node:test，原生 mjs）
        run: node --test packages/desktop/scripts/desktop-product-identity.test.mjs

  # ── Worker 容器页冒烟（wrangler dev --local，无需部署凭证）──────────────
  # 覆盖移动桥 worker 侧变更：容器页 i18n（Accept-Language）、卡片溢出修复
  # （box-sizing）、资源加载期保留卡片（waitForAppSurface 交接）、/app/ 503
  # 兜底双语、/api/rooms token 校验。
  worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Worker 冒烟（自动 npm install + wrangler dev --local）
        run: node scripts/e2e/worker-smoke.mjs

  anchor:
    runs-on: ubuntu-latest
    outputs:
      anchor: ${{ steps.anchor.outputs.anchor }}
      strategy: ${{ steps.anchor.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base 需要本 fork 完整历史
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 锚定官方提交
        id: anchor
        run: node scripts/ci/find-official-anchor.mjs
      - name: 摘要
        run: |
          echo "锚点（${{ steps.anchor.outputs.strategy }}）：${{ steps.anchor.outputs.anchorShort }}"

  e2e:
    needs: anchor
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            gui: "1"
            bundleOs: linux
            bundleArch: x64
          - os: windows-2022
            gui: ""
            bundleOs: win
            bundleArch: x64
          - os: macos-14
            gui: ""
            bundleOs: mac
            bundleArch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # 官方构建禁用签名发现
      ZCODE_OFFICIAL_REMOTE: https://github.com/zai-org/ZCode.git
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 官方源码 @ 锚点
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ needs.anchor.outputs.anchor }}
          path: official

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ── 0. 缓存：官方锚点不变 → 复用 unpacked 产物，跳过官方安装+构建 ─────
      # 键含锚点 SHA（merge-base），官方不动就命中；restore/save 分离 + 仅
      # success() 保存，避免失败构建的半成品污染不可变缓存键。
      - name: 恢复官方 unpacked 产物缓存（锚点级）
        id: official-dist
        uses: actions/cache/restore@v4
        with:
          path: |
            official/packages/desktop/dist/*-unpacked
            official/packages/desktop/dist/mac*
          key: official-dist-${{ matrix.os }}-${{ needs.anchor.outputs.anchor }}
      - name: 恢复 Electron 下载缓存
        if: steps.official-dist.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('official/packages/desktop/package.json') }}

      # ── 1. 构建 fork 产物（插件 CJS + 桌面 out/）─────────────────────────
      - name: fork 依赖
        run: pnpm install --no-frozen-lockfile
      - name: 构建插件（zcode-go.cjs）
        run: node plugin/build.mjs
      - name: 构建桌面产物（tsup + vite build，preview 身份）
        run: |
          cd packages/desktop
          ZCODE_PREVIEW_IDENTITY=1 npx tsup
          ZCODE_PREVIEW_IDENTITY=1 npx vite build

      # ── 2. 构建官方 @ 锚点（unpacked 即"安装态"；缓存命中则整段跳过）─────
      # 官方入口 `pnpm bundle:desktop`（README 打包章节）：内部调
      # `electron-builder --config electron-builder.config.js`，version 经
      # config 的 extraMetadata 取根 package.json，无需任何手动注入；
      # beforePack hooks 负责把 glm/zcode.cjs 等 agent bundle 装进产物。
      - name: 官方依赖
        if: steps.official-dist.outputs.cache-hit != 'true'
        working-directory: official
        run: pnpm install --no-frozen-lockfile
      - name: 构建官方桌面（官方入口 bundle:desktop）
        if: steps.official-dist.outputs.cache-hit != 'true'
        working-directory: official
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            # fpm 的 pacman target 用 bsdtar 生成 .MTREE（ubuntu runner 默认无）
            sudo apt-get update -y && sudo apt-get install -y libarchive-tools
          fi
          pnpm bundle:desktop -- --os ${{ matrix.bundleOs }} --arch ${{ matrix.bundleArch }}
      - name: 缓存命中提示
        if: steps.official-dist.outputs.cache-hit == 'true'
        run: echo "官方产物缓存命中（锚点 ${{ needs.anchor.outputs.anchor }}），已跳过官方安装与构建"
      - name: 定位官方二进制
        id: officialbin
        env:
          DESKTOP_DIR: ${{ github.workspace }}/official/packages/desktop
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const path = require("node:path");
          const dist = path.join(process.env.DESKTOP_DIR, "dist");
          function listDir(p) {
            try { return fs.readdirSync(p, { withFileTypes: true }).map((e) => e.name); } catch { return null; }
          }
          function largest(dir, names) {
            let best = null;
            for (const n of names) {
              const f = path.join(dir, n);
              try {
                const st = fs.statSync(f);
                if (st.isFile() && (!best || st.size > best.size)) best = { f, size: st.size };
              } catch { /* 跳过 */ }
            }
            return best?.f ?? null;
          }
          // 结构通用定位，不依赖构建身份（production=zcode/ZCode.exe，
          // preview=zcode-preview/"ZCode Preview.exe"/mac-arm64 目录）：
          //   linux: unpacked 根下 zcode* 无扩展名主程序；win: 根下非 Uninstall 的 .exe；
          //   darwin: dist 下任意 mac* 目录内 *.app/Contents/MacOS/* 可执行
          let bin = null; const notes = [];
          if (process.platform === "linux" || process.platform === "win32") {
            const dir = path.join(dist, process.platform === "linux" ? "linux-unpacked" : "win-unpacked");
            const names = listDir(dir) ?? [];
            const candidates = process.platform === "linux"
              ? names.filter((n) => /^zcode/i.test(n) && !n.includes("."))
              : names.filter((n) => /\.exe$/i.test(n) && !/^uninstall/i.test(n));
            bin = largest(dir, candidates);
            if (candidates.length > 0) notes.push(`${path.basename(dir)} 候选: ${candidates.join(", ")}`);
          } else {
            for (const d of (listDir(dist) ?? [])) {
              if (!/^mac/i.test(d)) continue;
              const dir = path.join(dist, d);
              const app = listDir(dir)?.find((e) => e.endsWith(".app"));
              if (!app) continue;
              const macBin = path.join(dir, app, "Contents", "MacOS");
              const exes = (listDir(macBin) ?? []).filter((e) => !e.includes("."));
              if (exes.length > 0) { bin = path.join(macBin, exes[0]); break; }
            }
          }
          if (!bin) {
            console.error(`未找到官方二进制。dist/=${JSON.stringify(listDir(dist))} 线索=${notes.join(" | ") || "(无)"}`);
            process.exit(1);
          }
          console.log(`bin=${bin}`);
          EOF
      - name: 官方二进制冒烟（RunAsNode）
        env:
          OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
        run: |
          if [ -z "$OFFICIAL_BIN" ] || [ "$OFFICIAL_BIN" = "undefined" ]; then
            echo "::error::官方二进制路径未解析：'$OFFICIAL_BIN'"
            exit 1
          fi
          ELECTRON_RUN_AS_NODE=1 "$OFFICIAL_BIN" -e "console.log('official-as-node OK', process.versions.node)"

      # 官方 anchor 包缺 glm 运行时束时补齐（takeover E2E 的官方实例冷启动
      # storage preparation 依赖：实测三平台 unsupported_runtime + "glm binary
      # path: <not found>"）。bundle:desktop 的 beforePack 未装束时，用 fork
      # 同源构建的 zcode.cjs 落到官方 unpacked resources/glm（同源代码，仅
      # 保证官方实例可完成存储准备与 onboarding，hook 链不涉及其模型调用）。
      - name: 官方包 glm 运行时束补齐（缺失时）
        env:
          OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
        run: |
          pnpm --filter @zcode/desktop prepare:agent-bundle
          node --input-type=module -e '
            import { cpSync, existsSync, mkdirSync } from "node:fs";
            import { dirname, join } from "node:path";
            const bin = process.env.OFFICIAL_BIN;
            if (!bin) throw new Error("officialbin 未就绪");
            const resources = join(dirname(bin), "resources");
            if (existsSync(join(resources, "glm", "zcode.cjs"))) {
              console.log("官方包已含 glm/zcode.cjs，跳过补齐");
            } else {
              const plat = process.platform === "win32" ? "win32" : process.platform === "darwin" ? "darwin" : "linux";
              const arch = process.arch === "arm64" ? "arm64" : "x64";
              const src = join("packages", "desktop", "bundled-agents", plat + "-" + arch, "glm");
              if (!existsSync(join(src, "zcode.cjs"))) throw new Error("fork bundled-agents 缺产物: " + src);
              mkdirSync(join(resources, "glm"), { recursive: true });
              cpSync(src, join(resources, "glm"), { recursive: true });
              console.log("已补齐官方包 glm 运行时束 ←", src);
            }
          '

      - name: macOS 官方 GUI 启动对照（归因 CI VM vs 克隆机制）
        if: runner.os == 'macOS'
        env:
          OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
        run: |
          "$OFFICIAL_BIN" --no-sandbox --disable-gpu >/tmp/official-gui.log 2>&1 &
          APP_PID=$!
          sleep 30
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "官方原版 GUI 在 CI VM 存活 30s ✓（克隆 bundle 崩溃则为我方装配问题）" | tee -a "$GITHUB_STEP_SUMMARY"
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "官方原版 GUI 亦无法在 CI VM 存活（虚拟化环境限制，非 zcode-go 问题）" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "尾部日志："; tail -5 /tmp/official-gui.log || true
          fi

      - name: 官方 runtime bundle 冒烟（RunAsNode + zcode.cjs）
        env:
          OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
        run: |
          # mac: bin 在 .app/Contents/MacOS/ 内，Resources 是其上一级（Contents）的兄弟
          if [ "$RUNNER_OS" = "macOS" ]; then
            BUNDLE="$(dirname "$(dirname "$OFFICIAL_BIN")")/Resources/glm/zcode.cjs"
          else
            BUNDLE="$(dirname "$OFFICIAL_BIN")/resources/glm/zcode.cjs"
          fi
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::未找到官方 runtime bundle：$BUNDLE"
            exit 1
          fi
          OUT="$(ELECTRON_RUN_AS_NODE=1 "$OFFICIAL_BIN" "$BUNDLE" --version 2>&1 || true)"
          echo "bundle --version → $OUT"
          case "$OUT" in *[![:space:]]*) ;; *) echo "::error::bundle 无输出"; exit 1;; esac

      # ── 3. 以官方机制挂载插件（config plugins.dirs，冷加载生效）──────────
      - name: 挂载插件到官方用户配置
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const configPath = path.join(os.homedir(), ".zcode", "cli", "config.json");
          fs.mkdirSync(path.dirname(configPath), { recursive: true });
          const config = fs.existsSync(configPath)
            ? JSON.parse(fs.readFileSync(configPath, "utf8"))
            : {};
          config.plugins = config.plugins ?? {};
          config.plugins.dirs = [path.join(process.env.GITHUB_WORKSPACE, "plugin")];
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
          console.log("plugins.dirs =", config.plugins.dirs[0]);
          EOF

      # ── 4. E2E ─────────────────────────────────────────────────────────
      - name: Linux GUI 工具
        if: runner.os == 'Linux'
        # wails e2e 实践：xdotool 需要 WM（windowactivate/z 序/任务栏状态），
        # 裸 Xvfb 不够；截图用 imagemagick，窗口树用 x11-utils。
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xdotool xvfb openbox x11-utils imagemagick wmctrl
      - name: E2E（Linux Xvfb+openbox / 其他平台核心+启动+运行时）
        env:
          ZCODE_GO_E2E_OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
          ZCODE_GO_E2E_GUI: ${{ matrix.gui }}
          ZCODE_GO_E2E_ALLOW_NO_RUNTIME: "1"
          ZCODE_GO_DISABLE_GPU: ${{ runner.os == 'macOS' && '1' || '' }}
          ZCODE_GO_E2E_ALLOW_NO_DESKTOP: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" bash -c '
              openbox >/tmp/openbox.log 2>&1 &
              sleep 2
              node scripts/e2e/run.mjs
              rc=$?
              kill %1 2>/dev/null || true
              exit $rc
            '
          else
            node scripts/e2e/run.mjs
          fi
      # ── 5. zcode-go 假 Provider 真链 E2E（goal 复核 + 静默 fork + 懒读取 + web 双向同步）──
      # HOME 沙箱隔离实例 + 官方运行时 + 脚本化假 Provider，零真人介入闭环：
      # 复用本 job 的桌面 out/ 与官方 unpacked（ensure 组装 ~/.zcode-go/electron，
      # 并从官方包补齐 packaged builtin provider 配置）。五条 E2E 全平台同跑
      # ——脚本内按 --lang=zh-CN 固定 UI 语言、HOME/USERPROFILE 沙箱、pid+平台
      # 工具终止；Linux 包 xvfb-run+openbox（脚本经 ZCODE_GO_E2E_DISPLAY 接动态
      # display）。失败不中断（|| rc=1）——一次跑全量，报告完整。
      # fresh-model 额外依赖：mobile-bridge/worker 的 wrangler（本地信令 dev）
      # 与 playwright chromium（web 端浏览器），见上方两个准备步骤。
      - name: 移动桥 Worker 依赖（fresh-model E2E 本地信令 wrangler dev）
        run: cd mobile-bridge/worker && npm install --no-audit --no-fund
      - name: Playwright Chromium（fresh-model E2E web 端浏览器）
        run: node node_modules/playwright-core/cli.js install chromium
      - name: zcode-go 假 Provider E2E（多平台）
        timeout-minutes: 50 # 步骤级兜底：正常 ~20min；单条 E2E 挂起由脚本内 18min 熔断先触发
        shell: bash
        env:
          ZCODE_OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
        run: |
          node scripts/ensure-official-electron.mjs
          APP_BIN="$(node -e '
            const os = require("node:os"), path = require("node:path");
            const root = path.join(os.homedir(), ".zcode-go", "electron");
            if (process.platform === "darwin") {
              // 官方产物按构建身份命名（preview = "ZCode Preview"）——克隆 .app
              // 保留原名，二进制名取 officialBin 的 basename
              const exe = path.basename(process.env.ZCODE_OFFICIAL_BIN ?? "zcode");
              console.log(path.join(root, "ZCode Go.app", "Contents", "MacOS", exe));
            } else {
              console.log(path.join(root, process.platform === "win32" ? "zcode.exe" : "zcode"));
            }
          ')"
          if [ ! -f "$APP_BIN" ]; then
            echo "::error::E2E app 不存在：$APP_BIN（ensure 产物异常；officialBin=$ZCODE_OFFICIAL_BIN）"
            ls -la "$(dirname "$(dirname "$(dirname "$(dirname "$APP_BIN")")")")" 2>/dev/null || true
            exit 1
          fi
          export ZCODE_GO_E2E_APP_BIN="$APP_BIN"
          echo "APP_BIN=$APP_BIN"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" bash -c '
              openbox >/tmp/openbox-fp.log 2>&1 &
              sleep 2
              export ZCODE_GO_E2E_DISPLAY="$DISPLAY"
              rc=0
              for e in goal-verify silent-fork-auto lazy-history takeover fresh-model; do
                echo "== E2E: $e =="
                node "scripts/e2e/$e-e2e.mjs" || rc=1
              done
              kill %1 2>/dev/null || true
              exit $rc
            '
          else
            rc=0
            for e in goal-verify silent-fork-auto lazy-history takeover fresh-model; do
              echo "== E2E: $e =="
              node "scripts/e2e/$e-e2e.mjs" || rc=1
            done
            exit $rc
          fi

      - name: 保存官方 unpacked 产物缓存（仅成功时，防半成品污染键）
        if: success() && steps.official-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            official/packages/desktop/dist/*-unpacked
            official/packages/desktop/dist/mac*
          key: official-dist-${{ matrix.os }}-${{ needs.anchor.outputs.anchor }}
      - name: 保存 Electron 下载缓存
        if: success() && steps.official-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('official/packages/desktop/package.json') }}

      - name: 上传分步截图（三平台，成功失败均产出，肉眼核对用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.os }}
          path: ~/.zcode-go/e2e-shots/
          if-no-files-found: ignore
          include-hidden-files: true
      # Windows 上 upload-artifact v4 拒绝 workspace（D:\...）之外的跨盘路径
      # （POSIX 的 ~ 同样在 workspace 外但被容忍）——先把现场拷进 workspace 再传。
      - name: Windows 产物收拢（跨盘规避）
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dst = "ci-logs-win"
          New-Item -ItemType Directory -Force -Path "$dst" | Out-Null
          foreach ($src in @("$env:USERPROFILE\.zcode-go", "$env:LOCALAPPDATA\Temp\zg-goal-e2e-*", "$env:LOCALAPPDATA\Temp\zg-sfk-e2e-*", "$env:LOCALAPPDATA\Temp\zg-lazy-e2e-*", "$env:LOCALAPPDATA\Temp\zg-fresh-e2e-*")) {
            if (Test-Path $src) { Copy-Item -Recurse -Force $src "$dst" -ErrorAction SilentlyContinue }
          }
          if (Test-Path "$dst\.zcode-go\electron") { Remove-Item -Recurse -Force "$dst\.zcode-go\electron" -ErrorAction SilentlyContinue }
      - name: 上传排障产物
        if: always() && runner.os != 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            ~/.zcode-go/
            !~/.zcode-go/electron
            ~/.zcode/v2/crash/
            ~/Library/Logs/DiagnosticReports/
            /tmp/zg-goal-e2e-*/
            /tmp/zg-sfk-e2e-*/
            /tmp/zg-lazy-e2e-*/
            /tmp/zg-fresh-e2e-*/
            /var/folders/*/*/T/zg-goal-e2e-*/
            /var/folders/*/*/T/zg-sfk-e2e-*/
            /var/folders/*/*/T/zg-lazy-e2e-*/
            /var/folders/*/*/T/zg-fresh-e2e-*/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: 上传排障产物（Windows 收拢目录）
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: ci-logs-win/
          if-no-files-found: ignore
          include-hidden-files: true
