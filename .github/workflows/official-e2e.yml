name: official-e2e

# 锚定官方提交（zai-org/ZCode merge-base）→ 三平台构建官方@锚点 + 本 fork 产物
# → 以官方机制挂载插件 → E2E（本地同款 scripts/e2e/run.mjs）。
# 官方升级后：merge-base 不变 → 锚点稳定；合并官方 → 锚点自动前移。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "packages/desktop/src/**"
      - "packages/services/src/zcode-agent/**"
      - "scripts/**"
      - ".github/workflows/official-e2e.yml"
  schedule:
    - cron: "0 19 * * *" # 每日 UTC 19 点（官方升级回归）

concurrency:
  group: official-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anchor:
    runs-on: ubuntu-latest
    outputs:
      anchor: ${{ steps.anchor.outputs.anchor }}
      strategy: ${{ steps.anchor.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base 需要本 fork 完整历史
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 锚定官方提交
        id: anchor
        run: node scripts/ci/find-official-anchor.mjs
      - name: 摘要
        run: |
          echo "锚点（${{ steps.anchor.outputs.strategy }}）：${{ steps.anchor.outputs.anchorShort }}"

  e2e:
    needs: anchor
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            gui: "1"
          - os: windows-2022
            gui: ""
          - os: macos-14
            gui: ""
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # 官方构建禁用签名发现
      ZCODE_OFFICIAL_REMOTE: https://github.com/zai-org/ZCode.git
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 官方源码 @ 锚点
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ needs.anchor.outputs.anchor }}
          path: official

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ── 0. 缓存：官方锚点不变 → 复用 unpacked 产物，跳过官方安装+构建 ─────
      # 键含锚点 SHA（merge-base），官方不动就命中；restore/save 分离 + 仅
      # success() 保存，避免失败构建的半成品污染不可变缓存键。
      - name: 恢复官方 unpacked 产物缓存（锚点级）
        id: official-dist
        uses: actions/cache/restore@v4
        with:
          path: official/packages/desktop/dist
          key: official-dist-${{ matrix.os }}-${{ needs.anchor.outputs.anchor }}
      - name: 恢复 Electron 下载缓存
        if: steps.official-dist.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('official/packages/desktop/package.json') }}

      # ── 1. 构建 fork 产物（插件 CJS + 桌面 out/）─────────────────────────
      - name: fork 依赖
        run: pnpm install --no-frozen-lockfile
      - name: 构建插件（zcode-go.cjs）
        run: node plugin/build.mjs
      - name: 构建桌面产物（tsup + vite build，preview 身份）
        run: |
          cd packages/desktop
          ZCODE_PREVIEW_IDENTITY=1 npx tsup
          ZCODE_PREVIEW_IDENTITY=1 npx vite build

      # ── 2. 构建官方 @ 锚点（unpacked 即"安装态"；缓存命中则整段跳过）─────
      # 官方 desktop package.json 无 version 字段（官方发布管线另行注入），
      # electron-builder 会 ⨯ 失败 —— 从官方根 package.json 借 version。
      - name: 注入 desktop version（electron-builder 必需）
        if: steps.official-dist.outputs.cache-hit != 'true'
        working-directory: official/packages/desktop
        run: |
          node -e "const fs=require('fs');const root=JSON.parse(fs.readFileSync('../../package.json','utf8'));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=p.version||root.version||'0.0.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('desktop version =',p.version)"
      - name: 官方依赖
        if: steps.official-dist.outputs.cache-hit != 'true'
        working-directory: official
        run: pnpm install --no-frozen-lockfile
      - name: 构建官方桌面（electron-builder --dir）
        if: steps.official-dist.outputs.cache-hit != 'true'
        working-directory: official/packages/desktop
        run: |
          pnpm run prepare:runtime-assets || true
          npx electron-builder --dir --publish never || pnpm run build
      - name: 缓存命中提示
        if: steps.official-dist.outputs.cache-hit == 'true'
        run: echo "官方产物缓存命中（锚点 ${{ needs.anchor.outputs.anchor }}），已跳过官方安装与构建"
      - name: 定位官方二进制
        id: officialbin
        env:
          DESKTOP_DIR: ${{ github.workspace }}/official/packages/desktop
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const path = require("node:path");
          const dist = path.join(process.env.DESKTOP_DIR, "dist");
          const dirsByPlat = {
            linux: ["linux-unpacked"],
            win32: ["win-unpacked"],
            darwin: ["mac", "mac-unpacked", "mac_universal"],
          };
          const namesByPlat = {
            linux: ["zcode", "ZCode"],
            win32: ["ZCode.exe", "zcode.exe"],
            darwin: [],
          };
          function listDir(p) {
            try { return fs.readdirSync(p, { withFileTypes: true }).map((e) => e.name); } catch { return null; }
          }
          // 精确名匹配 + 相对于 official/packages/desktop 的绝对路径（旧版在仓库根
          // glob dist/... 永远落空输出 undefined；字典序还会先撞上 chrome_crashpad_handler）
          let bin = null; const notes = [];
          for (const d of dirsByPlat[process.platform] ?? []) {
            const dir = path.join(dist, d);
            for (const n of namesByPlat[process.platform] ?? []) {
              const f = path.join(dir, n);
              if (fs.existsSync(f) && fs.statSync(f).isFile()) { bin = f; break; }
            }
            if (!bin && process.platform === "darwin") {
              const app = listDir(dir)?.find((e) => e.endsWith(".app"));
              if (app) {
                const macBin = path.join(dir, app, "Contents", "MacOS");
                const exes = (listDir(macBin) ?? []).filter((e) => !e.includes("."));
                if (exes.length > 0) bin = path.join(macBin, exes[0]);
              }
            }
            if (bin) break;
            const listing = listDir(dir);
            if (listing) notes.push(`${d}: ${listing.slice(0, 20).join(", ")}`);
          }
          if (!bin) {
            console.error(`未找到官方二进制。dist/=${JSON.stringify(listDir(dist))} 子目录=${notes.join(" | ") || "(无)"}`);
            process.exit(1);
          }
          console.log(`bin=${bin}`);
          EOF
      - name: 官方二进制冒烟（RunAsNode）
        env:
          OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
        run: |
          if [ -z "$OFFICIAL_BIN" ] || [ "$OFFICIAL_BIN" = "undefined" ]; then
            echo "::error::官方二进制路径未解析：'$OFFICIAL_BIN'"
            exit 1
          fi
          ELECTRON_RUN_AS_NODE=1 "$OFFICIAL_BIN" -e "console.log('official-as-node OK', process.versions.node)"

      # ── 3. 以官方机制挂载插件（config plugins.dirs，冷加载生效）──────────
      - name: 挂载插件到官方用户配置
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const configPath = path.join(os.homedir(), ".zcode", "cli", "config.json");
          fs.mkdirSync(path.dirname(configPath), { recursive: true });
          const config = fs.existsSync(configPath)
            ? JSON.parse(fs.readFileSync(configPath, "utf8"))
            : {};
          config.plugins = config.plugins ?? {};
          config.plugins.dirs = [path.join(process.env.GITHUB_WORKSPACE, "plugin")];
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
          console.log("plugins.dirs =", config.plugins.dirs[0]);
          EOF

      # ── 4. E2E ─────────────────────────────────────────────────────────
      - name: Linux GUI 工具
        if: runner.os == 'Linux'
        # wails e2e 实践：xdotool 需要 WM（windowactivate/z 序/任务栏状态），
        # 裸 Xvfb 不够；截图用 imagemagick，窗口树用 x11-utils。
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xdotool xvfb openbox x11-utils imagemagick
      - name: E2E（Linux Xvfb+openbox / 其他平台核心+启动+运行时）
        env:
          ZCODE_GO_E2E_OFFICIAL_BIN: ${{ steps.officialbin.outputs.bin }}
          ZCODE_GO_E2E_GUI: ${{ matrix.gui }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" bash -c '
              openbox >/tmp/openbox.log 2>&1 &
              sleep 2
              node scripts/e2e/run.mjs
              rc=$?
              kill %1 2>/dev/null || true
              exit $rc
            '
          else
            node scripts/e2e/run.mjs
          fi
      - name: 保存官方 unpacked 产物缓存（仅成功时，防半成品污染键）
        if: success() && steps.official-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: official/packages/desktop/dist
          key: official-dist-${{ matrix.os }}-${{ needs.anchor.outputs.anchor }}
      - name: 保存 Electron 下载缓存
        if: success() && steps.official-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('official/packages/desktop/package.json') }}

      - name: 上传分步截图（三平台，成功失败均产出，肉眼核对用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.os }}
          path: ~/.zcode-go/e2e-shots/
          if-no-files-found: ignore
      - name: 上传排障产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            ~/.zcode-go/
            official/packages/desktop/dist/
          if-no-files-found: ignore
