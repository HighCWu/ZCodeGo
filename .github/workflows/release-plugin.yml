# zcode-go 插件发布链（url-zip 分发）。
#
# 官方安装器对市场条目 url 来源的分发（bundle Jdt 实证）：必须 type:"zip" 才走
# zip 安装器，且 sha256 必填、下载后强校验；无 type 会被当作 git URL 克隆。
# 因此本工作流除了出 zip，还要把 marketplace.json 改写为
#   { source:"url", type:"zip", url:<固定 tag 的资产>, sha256:<本次产物摘要> }
# 并推送回仓库——市场条目与 release 一一对应，用户「刷新市场 → 更新插件」即得新版。
# （滚动 latest + 静态 sha256 互斥，不可行；仓库零内容入库：packs 由
# scripts/opc/fetch-opc-packs.mjs 从用户 fork 拉取后注入 staging。）
name: release-plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "插件版本号（留空则用 package.json 版本 + run number）"
        required: false
        type: string
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（plugin cjs 构建需要 esbuild）
        run: pnpm install --frozen-lockfile

      # packs 从用户 fork 拉取（HighCWu/OpenOPC、HighCWu/claude-skills，可被
      # OPC_PACK_*_REPO 覆盖）；写入 plugin/opc-packs/（已 gitignore，仅进 zip）。
      # GH_TOKEN 让 gh api 用认证通道取 commit sha（匿名 api.github.com 共享限流）。
      - name: 拉取 OPC 模板包
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/opc/fetch-opc-packs.mjs --out plugin/opc-packs

      - name: 构建插件 cjs
        run: node plugin/build.mjs

      - name: 计算版本号
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "PLUGIN_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/plugin-v* ]]; then
            echo "PLUGIN_VERSION=${GITHUB_REF#refs/tags/plugin-v}" >> "$GITHUB_ENV"
          else
            PKG=$(node -e "console.log(require('./package.json').version)")
            echo "PLUGIN_VERSION=${PKG}-zcode-go.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: 组装 zip（staging 改写版本号；单顶层目录供 stripRoot 剥壳）
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/plugin-staging"
          mkdir -p "$STAGING/zcode-go"
          # 发布物精简：manifest + hooks（cjs/json/bootstrap）+ commands + README + packs
          cp -r plugin/.zcode-plugin plugin/commands plugin/hooks plugin/README.md "$STAGING/zcode-go/"
          if [ -d plugin/opc-packs ]; then cp -r plugin/opc-packs "$STAGING/zcode-go/opc-packs"; fi
          node -e '
            const fs = require("node:fs");
            const pluginRoot = process.argv[1];
            const version = process.argv[2];
            const target = `${pluginRoot}/.zcode-plugin/plugin.json`;
            const json = JSON.parse(fs.readFileSync(target, "utf8"));
            json.version = version;
            fs.writeFileSync(target, `${JSON.stringify(json, null, 2)}\n`);
            console.log(`[release-plugin] 版本 ${version}`);
          ' "$STAGING/zcode-go" "$PLUGIN_VERSION"
          # 不得包含符号链接（官方安装器拒绝 zip symlink 条目）
          if find "$STAGING" -type l | grep -q .; then echo "staging 含符号链接"; exit 1; fi
          (cd "$STAGING" && zip -qr "$RUNNER_TEMP/zcode-go-plugin.zip" zcode-go)
          mkdir -p dist
          cp "$RUNNER_TEMP/zcode-go-plugin.zip" dist/zcode-go-plugin.zip
          # 结构断言（不用 head 截断管道——pipefail 下 SIGPIPE 会误判失败）
          unzip -l "$RUNNER_TEMP/zcode-go-plugin.zip" > "$RUNNER_TEMP/zip-listing.txt"
          grep -q "zcode-go/.zcode-plugin/plugin.json" "$RUNNER_TEMP/zip-listing.txt"
          echo "模板包 md 条目数：$(grep -c 'opc-packs/.*\.md' "$RUNNER_TEMP/zip-listing.txt")"
          echo "ZIP_PATH=$RUNNER_TEMP/zcode-go-plugin.zip" >> "$GITHUB_ENV"
          sha256sum "$ZIP_PATH" | awk '{print "ZIP_SHA256=" $1}' >> "$GITHUB_ENV"

      - name: 发布固定 tag 的 release（plugin-v<版本>）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="plugin-v$PLUGIN_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" zcode-go-plugin.zip -y || true
            gh release upload "$TAG" "$ZIP_PATH" --clobber
          else
            gh release create "$TAG" "$ZIP_PATH" \
              --title "zcode-go plugin v$PLUGIN_VERSION" \
              --notes "插件市场安装包（含 OPC 模板包）。marketplace.json 已由本工作流同步指向本资产。"
          fi

      # zip 的 sha256 每次发布都变（安装器强校验），市场清单必须与资产一一对应：
      # 改写 marketplace.json 后推送回仓库，用户「刷新市场 → 更新插件」即得新版。
      - name: 同步 marketplace.json（url-zip + sha256）并推送
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/plugin-v$PLUGIN_VERSION/zcode-go-plugin.zip"
          node -e '
            const fs = require("node:fs");
            const url = process.argv[1];
            const sha256 = process.argv[2];
            const path = "marketplace.json";
            const catalog = JSON.parse(fs.readFileSync(path, "utf8"));
            catalog.plugins = catalog.plugins.map((entry) =>
              entry.name === "zcode-go"
                ? { ...entry, source: { source: "url", type: "zip", url, sha256 } }
                : entry,
            );
            fs.writeFileSync(path, `${JSON.stringify(catalog, null, 2)}\n`);
            console.log(`[release-plugin] marketplace.json → ${url} sha256=${sha256.slice(0, 12)}…`);
          ' "$ASSET_URL" "$ZIP_SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json
          git commit -m "chore(release): marketplace.json 指向插件 zip v$PLUGIN_VERSION"
          # tag 触发时 checkout 在游离点：提交的父提交即 tag 所指的主分支提交，
          # 推回 main 为快进；期间若有并发提交则失败（可重跑，不影响已上传资产）
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            git push origin "HEAD:main"
          fi

      - name: 上传构建产物（留档）
        uses: actions/upload-artifact@v4
        with:
          name: zcode-go-plugin-${{ env.PLUGIN_VERSION }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
