#:schema node_modules/wrangler/config-schema.json
name = "zcode-go-mobile-bridge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 自定义域（CF 托管 aimon.win zone）：桌面端默认信令地址。
routes = [
  { pattern = "zcode-go.aimon.win", custom_domain = true }
]

# 限频 binding（GA 语法 [[ratelimits]]，wrangler ≥ 4.36）。旧 [[unsafe.bindings]]
# 写法在 GA 后只作为过渡兼容上传、生产实测不再 provision（25 连打 5/min 桶零
# 拦截，恒 fail-open）——已迁移。这些 binding 是外层第二道：权威判定在
# RateLimiter DO（src/ratelimit.ts，强一致）；binding 若生效则在 DO 之前拦截，
# 省 DO 调用。period 仅允许 10 或 60。
[[ratelimits]]
name = "ROOM_CREATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "SIGNAL_CONNECT_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PAGE_LIMIT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 120
  period = 60

# 信令房间：Durable Objects + WebSocket Hibernation。
[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

# 强一致限频 DO（ratelimit binding 生产实测 fail-open，见 src/ratelimit.ts）。
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true
