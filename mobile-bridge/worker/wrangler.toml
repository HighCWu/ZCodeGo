#:schema node_modules/wrangler/config-schema.json
name = "zcode-go-mobile-bridge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 自定义域（CF 托管 aimon.win zone）：桌面端默认信令地址。
routes = [
  { pattern = "zcode-go.aimon.win", custom_domain = true }
]

# 限频 binding（GA 语法 [[ratelimits]]，wrangler ≥ 4.36；period 仅允许 10|60）。
# 定位：外层 early-rejection（官方语义 permissive / 最终一致 / per-location，
# 突发流量会过冲——不能用 burst 测试证伪它，也不能拿它做精确计数）。
# 权威判定在 RateLimiter DO（src/ratelimit.ts，强一致精确）。两层协作实测：
# TEST_LIMIT(2/60s) 间隔请求第 4 拍起 success=false（计数生效）；
# 突发 8 连打全过冲放行由 DO 精确拦截——正是设计分工。
[[ratelimits]]
name = "ROOM_CREATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "SIGNAL_CONNECT_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PAGE_LIMIT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 120
  period = 60

# 信令房间：Durable Objects + WebSocket Hibernation。
[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

# 强一致限频 DO（ratelimit binding 生产实测 fail-open，见 src/ratelimit.ts）。
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true
